<div class="container mt-4">
  <div class="header-section mb-4">
    <h2><i class="bi bi-person-plus"></i> Añadir Nuevo Artista</h2>
    <p class="text-muted">Busca un artista en la red global para importarlo a Sonara.</p>
  </div>

  <div class="search-box p-4 bg-light rounded shadow-sm mb-4">
    <div class="input-group input-group-lg">
      <input type="text" class="form-control" 
             placeholder="Nombre del artista..." 
             [(ngModel)]="nombreBusqueda"
             (keyup.enter)="buscarEnApiExterna()">
      <button class="btn btn-primary" type="button" (click)="buscarEnApiExterna()" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
        {{ loading ? 'Buscando...' : 'Verificar Artista' }}
      </button>
    </div>
    <div *ngIf="error" class="text-danger mt-2 small">
      <i class="bi bi-exclamation-triangle"></i> {{ error }}
    </div>
  </div>

  <!-- Resultado de la búsqueda -->
  <div *ngIf="artistaEncontrado" class="card border-0 shadow animate__animated animate__fadeIn">
    <div class="row g-0">
      <div class="col-md-4">
        <img [src]="artistaEncontrado.strArtistThumb" class="img-fluid rounded-start h-100" style="object-fit: cover;" alt="Foto artista">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h3 class="card-title">{{ artistaEncontrado.strArtist }}</h3>
          <p class="badge bg-secondary mb-2">{{ artistaEncontrado.strGenre || 'Género desconocido' }}</p>
          <p class="card-text text-truncate-multiline">
            {{ artistaEncontrado.strBiographyES || artistaEncontrado.strBiographyEN || 'Sin biografía disponible.' }}
          </p>
          
          <div class="mt-4">
            <button class="btn btn-success btn-lg me-2" (click)="confirmarYGuardar()" [disabled]="saving">
              <i class="bi bi-check-circle"></i> {{ saving ? 'Importando...' : 'Confirmar e Importar' }}
            </button>
            <button class="btn btn-outline-danger" (click)="artistaEncontrado = null">
              Cancelar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
