<div class="main-container">
    <header class="header-text">
        <h1>¿No tienes una Cuenta?</h1>
        <p>Regístrate fácilmente en Sonara</p>
    </header>
    
    <div class="signup-card">
        <h2>Sign Up</h2>
        
        @if (error) {
            <p class="error-global">{{ error }}</p>
        }

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <!-- Nombre de Usuario -->
            <div class="input-group-custom">
                <label for="username">Nombre de Usuario</label>
                <input type="text" id="username" formControlName="nombre">
            </div>

            <!-- Email -->
            <div class="input-group-custom">
                <label for="Email">Correo Electrónico</label>
                <input type="email" id="Email" formControlName="email">
            </div>

            <!-- Localidad -->
            <div class="input-group-custom">
                <label for="localidad">Localidad</label>
                <select id="localidad" formControlName="localidadId">
                    <option [ngValue]="null">Selecciona tu ciudad</option>
                    @for (loc of localidades; track loc.id) {
                        <option [value]="loc.id">{{ loc.nombreCiudad }}</option>
                    }
                </select>
            </div>

            <!-- Fecha Nacimiento -->
            <div class="input-group-custom">
                <label for="dateOfBirth">Fecha de Nacimiento</label>
                <input type="date" id="dateOfBirth" formControlName="fechaNacimiento">
            </div>

            <!-- Password -->
            <div class="input-group-custom">
                <label for="password">Contraseña</label>
                <input type="password" id="password" formControlName="contrasenaHash">
            </div>

            <!-- Repeat Password -->
            <div class="input-group-custom">
                <label for="repeatPassword">Repite la Contraseña</label>
                <input type="password" id="repeatPassword" formControlName="repeatPassword">
                
                @if (registerForm.hasError('passwordMismatch') && registerForm.get('repeatPassword')?.touched) {
                    <small class="error-text">Las contraseñas no coinciden.</small>
                }
            </div>

            <button type="submit" 
                    class="btn-register" 
                    [disabled]="registerForm.invalid || loading">
                {{ loading ? 'Registrando...' : 'Registrarse' }}
            </button>
        </form>
    </div>
</div>
