<div class="votar-component">
    <div class="votar-card" *ngIf="artista">
      <div class="info">
        <h3>{{ artista.nombre }}</h3>
        <p class="genero">{{ artista.genero }}</p>
      </div>
    
      <div class="ranking">
        <span class="votos-count">
          <span class="numero">{{ artista.votosRanking }}</span> votos
        </span>
        <button (click)="votar()" [disabled]="cargando" class="btn-votar">
          {{ cargando ? 'Enviando...' : '¡Votar!' }}
        </button>
      </div>
    </div>
</div>
