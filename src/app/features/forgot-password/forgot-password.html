<div class="overlay-container">
  <div class="main-container">
    <header class="header-text">
      <h1>{{"LOGIN.FORGOTPASS" | translate}}</h1>
      <p>Introduce tu email para enviarte un enlace de recuperación.</p>
    </header>

    <div class="signup-card">
      
      <form (ngSubmit)="onSendEmail()" *ngIf="!emailSent">
        <div class="input-group-custom">
          <label for="email">{{"GENERAL.EMAIL" | translate}}</label>
          <input type="email" [(ngModel)]="email" name="email" id="email" required placeholder="ejemplo@correo.com">
        </div>
        
        <button type="submit" class="btn-register">
          Enviar enlace de recuperación
        </button>
      </form>

      <div *ngIf="emailSent" class="success-box text-center p-4" style="background-color: #e6f7ff; border: 1px solid #91d5ff; border-radius: 8px; margin: 15px 0;">
        <p style="color: #2f2a2a; font-weight: 500; font-size: 15px; margin: 0; line-height: 1.5;">
          {{ successMessage }}
        </p>
      </div>

      <div class="cuenta-centro mt-4">
        <a [routerLink]="['/login']" class="back-link">← {{"GENERAL.GOBACK" | translate}}</a>
      </div>
    </div>
  </div>
</div>
