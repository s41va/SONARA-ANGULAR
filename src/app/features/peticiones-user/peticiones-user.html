<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <h2>{{ "PETICIONES.TITLE" | translate}}</h2>
      <p>{{ "PETICIONES.INFO" | translate}}</p>
    </div>

    <form [formGroup]="solicitudForm" (ngSubmit)="enviarSolicitud()">
      
      <div class="form-group">
        <label for="nombreArtista">{{ "PETICIONES.ARTISTNAME" | translate}}</label>
        <input 
          type="text" 
          id="nombreArtista" 
          formControlName="nombreArtista" 
          placeholder="Ej: Los Turquesas"
          [class.error]="solicitudForm.get('nombreArtista')?.invalid && solicitudForm.get('nombreArtista')?.touched">
      </div>

      <div class="form-group">
        <label for="generoSugerido">{{ "PETICIONES.GENRE" | translate}}</label>
        <input 
          type="text" 
          id="generoSugerido" 
          formControlName="generoSugerido" 
          placeholder="Ej: Rock, Jazz, Pop...">
      </div>

      <div class="form-group">
        <label for="fotoUrl">{{ "PETICIONES.PIC" | translate}}</label>
        <input 
          type="text" 
          id="fotoUrl" 
          formControlName="fotoUrl" 
          placeholder="https://ejemplo.com/foto.jpg">
      </div>

      <div class="form-group">
        <label for="descripcion">{{ "PETICIONES.DESCRIPTION" | translate}}</label>
        <textarea 
          id="descripcion" 
          formControlName="descripcion" 
          rows="4" 
          placeholder= "{{'PETICIONES.PLACEHOLDERARTIST' | translate }}"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="solicitudForm.invalid || isSubmitting" class="btn-submit">
          {{ isSubmitting ? 'Enviando...' : 'Enviar Solicitud' }}
        </button>
      </div>

    </form>
  </div>
</div>
